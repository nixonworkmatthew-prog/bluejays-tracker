<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; }
    .tab-btn { padding: 14px 32px; border-radius: 9999px; font-weight: 700; }
    .tab-btn.active { background-color: #10b981; color: white; }
    th { cursor: pointer; user-select: none; }
    th:hover { background-color: #052e16; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #18181b; width: 90%; max-width: 1000px; border-radius: 16px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body class="min-h-screen p-8">
  <div class="max-w-7xl mx-auto">

    <div class="flex items-center justify-center gap-6 mb-10">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/7/7a/Toronto_Blue_Jays_logo.svg/800px-Toronto_Blue_Jays_logo.svg.png" alt="Blue Jays" class="h-20">
      <h1 class="text-5xl font-bold">Blue Jays Season Tracker</h1>
    </div>

    <div class="flex justify-center mb-12">
      <select id="season-select" onchange="switchSeason()" class="bg-zinc-900 text-white px-10 py-5 rounded-3xl text-2xl border border-zinc-700">
        <option value="2022">2022 Season</option>
        <option value="2023">2023 Season</option>
        <option value="2024">2024 Season</option>
        <option value="2025">2025 Season</option>
        <option value="2026">2026 Season</option>
      </select>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-10 mb-12">
      <h2 id="season-title" class="text-4xl font-bold text-center mb-8">2022 Season</h2>
      <div class="grid grid-cols-2 md:grid-cols-6 gap-6" id="leaders-grid"></div>
    </div>

    <div class="flex justify-center gap-6 mb-12">
      <button onclick="showTab(0)" id="tab0" class="tab-btn active">Hitting</button>
      <button onclick="showTab(1)" id="tab1" class="tab-btn">Pitching</button>
      <button onclick="showTab(2)" id="tab2" class="tab-btn">Games</button>
    </div>

    <!-- Hitting Tab -->
    <div id="content-0">
      <div class="bg-zinc-900 rounded-3xl overflow-x-auto">
        <table class="w-full">
          <thead class="bg-zinc-800">
            <tr>
              <th class="py-6 px-8 text-left">Player</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(1,'hit')">AB</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(2,'hit')">R</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(3,'hit')">H</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(4,'hit')">2B</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(5,'hit')">3B</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(6,'hit')">HR</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(7,'hit')">RBI</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(8,'hit')">BB</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(9,'hit')">K</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(10,'hit')">AVG</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(11,'hit')">OBP</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(12,'hit')">SLG</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(13,'hit')">OPS</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(14,'hit')">WAR</th>
            </tr>
          </thead>
          <tbody id="hitting-body" class="divide-y divide-zinc-700"></tbody>
        </table>
      </div>
    </div>

    <!-- Pitching Tab -->
    <div id="content-1" class="hidden">
      <div class="bg-zinc-900 rounded-3xl overflow-x-auto">
        <table class="w-full">
          <thead class="bg-zinc-800">
            <tr>
              <th class="py-6 px-8 text-left">Pitcher</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(1,'pitch')">IP</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(2,'pitch')">H</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(3,'pitch')">R</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(4,'pitch')">ER</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(5,'pitch')">BB</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(6,'pitch')">K</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(7,'pitch')">ERA</th>
              <th class="py-6 px-6 text-right" onclick="sortTable(8,'pitch')">WHIP</th>
            </tr>
          </thead>
          <tbody id="pitching-body" class="divide-y divide-zinc-700"></tbody>
        </table>
      </div>
    </div>

    <!-- Games Tab -->
    <div id="content-2" class="hidden bg-zinc-900 rounded-3xl p-16 text-center text-zinc-400">
      Game log for the selected season.<br>Upload a new scoresheet and I will add the game here.
    </div>
  </div>

    function renderHitting() {
      const tbody = document.getElementById('hitting-body');
      tbody.innerHTML = '';
      const data = seasons[currentSeasonKey].hitting || [];

        tbody.innerHTML = `<tr><td colspan="15" class="py-12 text-center text-zinc-400">No hitting stats yet for this season.</td></tr>`;

      }
      data.forEach(p => {
        const row = document.createElement('tr');
        row.className = "hover:bg-zinc-800 cursor-pointer";
        row.innerHTML = `
          <td class="py-6 px-8 text-emerald-400 hover:underline" onclick="showPlayerCareer('${p[0]}', 'hitting')">${p[0]}</td>
          <td class="text-right px-6">${p[1]}</td>
          <td class="text-right px-6">${p[2]}</td>
          <td class="text-right px-6">${p[3]}</td>
          <td class="text-right px-6">${p[4]||0}</td>
          <td class="text-right px-6">${p[5]||0}</td>
          <td class="text-right px-6">${p[6]||0}</td>

    function showPlayerCareer(playerName, type) {
      let html = `<h3 class="text-2xl mb-6">Career ${type === 'hitting' ? 'Hitting' : 'Pitching'} Stats for ${playerName}</h3>`;
      html += `<table class="w-full text-sm"><thead><tr class="border-b border-zinc-700"><th class="text-left py-2">Season</th>`;

      if (type === 'hitting') {
        html += `<th class="text-right">AB</th><th class="text-right">R</th><th class="text-right">H</th><th class="text-right">HR</th><th class="text-right">RBI</th><th class="text-right">AVG</th><th class="text-right">OPS</th></tr></thead><tbody>`;
      } else {
        html += `<th class="text-right">IP</th><th class="text-right">H</th><th class="text-right">R</th><th class="text-right">ER</th><th class="text-right">BB</th><th class="text-right">K</th><th class="text-right">ERA</th></tr></thead><tbody>`;
      }

      let totals = type === 'hitting' ? {ab:0,r:0,h:0,hr:0,rbi:0} : {ip:0,h:0,r:0,er:0,bb:0,k:0};

      Object.keys(seasons).forEach(key => {
        if (key === "2025" || key === "2026") return;
        const s = seasons[key];
        const list = type === 'hitting' ? s.hitting : s.pitching;
        const player = list ? list.find(p => p[0] === playerName) : null;
        if (player) {
          if (type === 'hitting') {
            const [name, ab, r, h, d2, d3, hr, rbi, bb, k, avg, obp, slg, ops] = player;
            totals.ab += ab || 0;
            totals.r += r || 0;
            totals.h += h || 0;
            totals.hr += hr || 0;
            totals.rbi += rbi || 0;
            html += `<tr class="border-b border-zinc-700">
              <td class="py-3">${key}</td>
              <td class="text-right">${ab}</td>
              <td class="text-right">${r}</td>
              <td class="text-right">${h}</td>
              <td class="text-right">${hr||0}</td>
              <td class="text-right">${rbi}</td>
              <td class="text-right">${avg}</td>
              <td class="text-right">${ops}</td>
            </tr>`;
          } else {
            const [name, ip, h, r, er, bb, k, era, whip] = player;
            totals.ip += parseFloat(ip) || 0;
            totals.h += h || 0;
            totals.r += r || 0;
            totals.er += er || 0;
            totals.bb += bb || 0;
            totals.k += k || 0;
            html += `<tr class="border-b border-zinc-700">
              <td class="py-3">${key}</td>
              <td class="text-right">${ip}</td>
              <td class="text-right">${h}</td>
              <td class="text-right">${r}</td>
              <td class="text-right">${er}</td>
              <td class="text-right">${bb}</td>
              <td class="text-right">${k}</td>
              <td class="text-right">${era}</td>
            </tr>`;
          }
        }
      });

      html += `</tbody></table>`;

      if (type === 'hitting') {
        const careerAVG = totals.ab ? (totals.h / totals.ab).toFixed(3) : ".000";
        html += `<div class="mt-8 bg-zinc-800 p-6 rounded-2xl">
          <h4 class="text-xl mb-4">Career Totals</h4>
          <p>AB: ${totals.ab} | R: ${totals.r} | H: ${totals.h} | HR: ${totals.hr} | RBI: ${totals.rbi} | AVG: ${careerAVG}</p>
        </div>`;
      } else {
        html += `<div class="mt-8 bg-zinc-800 p-6 rounded-2xl">
          <h4 class="text-xl mb-4">Career Totals</h4>
          <p>IP: ${totals.ip.toFixed(1)} | H: ${totals.h} | R: ${totals.r} | ER: ${totals.er} | BB: ${totals.bb} | K: ${totals.k}</p>
        </div>`;
      }

      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-player-name').textContent = playerName;
      document.getElementById('player-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('player-modal').style.display = 'none';
    }

    function showTab(n) {
      document.querySelectorAll('#content-0, #content-1, #content-2').forEach(el => el.classList.add('hidden'));
      document.getElementById('content-' + n).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab' + n).classList.add('active');
    }

    function switchSeason() {
      currentSeasonKey = document.getElementById('season-select').value;
      document.getElementById('season-title').textContent = seasons[currentSeasonKey].name;
      renderHitting();
      renderPitching();
      renderLeaders();
    }

    function sortTable(col, type) {
      const tbody = type === 'hit' ? document.getElementById('hitting-body') : document.getElementById('pitching-body');
      let rows = Array.from(tbody.rows);
      sortDir[col] = !sortDir[col];
      rows.sort((a, b) => {
        let valA = a.cells[col].textContent.trim();
        let valB = b.cells[col].textContent.trim();
        if (col > 0) { valA = parseFloat(valA) || 0; valB = parseFloat(valB) || 0; }
        return sortDir[col] ? valB - valA : valA - valB;
      });
      rows.forEach(row => tbody.appendChild(row));
    }

    window.onload = function() {
      renderHitting();
      renderPitching();
      renderLeaders();
      showTab(0);
    };
  </script>
</body>
</html>
